<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matches - FootballVerse</title>

    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="../css/responsive.css">

</head>

<body>

    <h1 class="matches-title">Football Matches</h1>


    <div class="matches-filter">

        <button class="filter-btn active" data-filter="all">
            All
        </button>

        <button class="filter-btn" data-filter="live">
            Live
        </button>

        <button class="filter-btn" data-filter="upcoming">
            Upcoming
        </button>

        <button class="filter-btn" data-filter="finished">
            Finished
        </button>

    </div>


    <div id="matches-container">

        <!-- Matches generated by JavaScript -->

    </div>


    <script src="../js/matches.js"></script>

</body>

</html>
