<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Standings - FootballVerse</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <h1 class="standings-title">Premier League Standings</h1>


    <!-- Standings Legend -->

    <div class="standings-legend">

        <div>
            <span class="legend-color champions-color"></span>
            Champions League
        </div>

        <div>
            <span class="legend-color europa-color"></span>
            Europa League
        </div>

        <div>
            <span class="legend-color relegation-color"></span>
            Relegation
        </div>

    </div>


    <!-- Standings Table -->

    <div class="standings-wrapper">

        <div class="standings-table">

            <!-- Table Header -->

            <div class="standing-header">

                <div>#</div>
                <div>Team</div>
                <div>GP</div>
                <div>W</div>
                <div>D</div>
                <div>L</div>
                <div>GD</div>
                <div>Pts</div>

            </div>


            <!-- Rows generated by JavaScript -->

            <div id="standings-container">

            </div>

        </div>

    </div>


    <script src="../js/standings.js"></script>

</body>

</html>
